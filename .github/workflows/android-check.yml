# Compiles the Android app on GitHub's servers, so native code (the alarm module)
# is checked on every push. Also uploads a standalone APK you can install.
name: Android check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK (arm64 only, for speed)
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: handbake-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
